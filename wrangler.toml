# Cloudflare Pages project for the Next.js site. Account: Pressroom@dailyborg.com.
# This file names dailyborg-site and the ONE production database. Never point it anywhere else.
name = "dailyborg-site"
pages_build_output_dir = ".vercel/output/static"
compatibility_date = "2026-03-05"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "dailyborg-db"
database_id = "c412efcd-54d8-47a6-9ca5-8522417992c3"
migrations_dir = "src/migrations"

[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "borg-images"
